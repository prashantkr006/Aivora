
# Three services share the same repo checkout via a bind-mount so the
# webapp SQLite and the .env stay in sync between them.  In a real
# deployment you'd bake a versioned image and mount only ./data.
#
#   dashboard  — Streamlit UI (8501). Users log in here, view state.
#   auth       — FastAPI OAuth callback sidecar (8502).
#   worker     — headless APScheduler. Runs 5-min ticks per active user
#                REGARDLESS of whether the dashboard is being visited.
#
# config.yaml is bind-mounted like the code, not baked into the image.
# It used to be COPY'd at build time while src/ and scripts/ were mounted,
# so a `git pull && docker compose restart` picked up every code change and
# silently ignored every config change. That is how a corrected lot size
# sat in the repo, deployed, and still had no effect in production.
services:
  dashboard:
    build: .
    image: aivora:latest
    ports:
      - "8501:8501"
    environment:
      - AIVORA_DASHBOARD_URL=${AIVORA_DASHBOARD_URL:-http://localhost:8501}
      - AIVORA_AUTH_URL=${AIVORA_AUTH_URL:-http://localhost:8502}
      - AIVORA_MASTER_KEY=${AIVORA_MASTER_KEY}
      - TZ=Asia/Kolkata
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./models:/app/models
      - ./scripts:/app/scripts
      - ./src:/app/src
      - ./app:/app/app
      - ./config.yaml:/app/config.yaml:ro
    depends_on:
      - auth
    restart: unless-stopped

  auth:
    build: .
    image: aivora:latest
    command: >
      python -m scripts.run_auth_server
    ports:
      - "8502:8502"
    environment:
      - AIVORA_DASHBOARD_URL=${AIVORA_DASHBOARD_URL:-http://localhost:8501}
      - AIVORA_MASTER_KEY=${AIVORA_MASTER_KEY}
      - AIVORA_AUTH_PORT=8502
      - TZ=Asia/Kolkata
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./scripts:/app/scripts
      - ./src:/app/src
      - ./config.yaml:/app/config.yaml:ro
    restart: unless-stopped

  worker:
    build: .
    image: aivora:latest
    command: >
      python -m scripts.run_worker
    environment:
      - AIVORA_MASTER_KEY=${AIVORA_MASTER_KEY}
      - TZ=Asia/Kolkata
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./models:/app/models
      - ./scripts:/app/scripts
      - ./src:/app/src
      - ./config.yaml:/app/config.yaml:ro
    restart: unless-stopped
